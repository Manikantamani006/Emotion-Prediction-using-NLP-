<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="MoodLens AI banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0B14"/>
      <stop offset="100%" stop-color="#171128"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="25%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0; 0.5 0; -0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- floating orbs -->
  <circle cx="120" cy="70" r="46" fill="#8B5CF6" opacity="0.12">
    <animate attributeName="cy" values="70;100;70" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="270" r="60" fill="#EC4899" opacity="0.08">
    <animate attributeName="cy" values="270;240;270" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="60" r="38" fill="#10B981" opacity="0.10">
    <animate attributeName="cy" values="60;90;60" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#title)" filter="url(#glow)">MoodLens AI</text>
  <text x="74" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#A5A5C0">Emotion prediction for text — in real time</text>

  <!-- emotion chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="74" y="225" width="70" height="30" rx="15" fill="#F59E0B" opacity="0.18"/><text x="109" y="246" fill="#F59E0B" text-anchor="middle">Joy</text>
    <rect x="152" y="225" width="90" height="30" rx="15" fill="#3B82F6" opacity="0.18"/><text x="197" y="246" fill="#3B82F6" text-anchor="middle">Sadness</text>
    <rect x="250" y="225" width="80" height="30" rx="15" fill="#EF4444" opacity="0.18"/><text x="290" y="246" fill="#EF4444" text-anchor="middle">Anger</text>
    <rect x="338" y="225" width="70" height="30" rx="15" fill="#EC4899" opacity="0.18"/><text x="373" y="246" fill="#EC4899" text-anchor="middle">Love</text>
    <rect x="416" y="225" width="70" height="30" rx="15" fill="#8B5CF6" opacity="0.18"/><text x="451" y="246" fill="#8B5CF6" text-anchor="middle">Fear</text>
    <rect x="494" y="225" width="96" height="30" rx="15" fill="#10B981" opacity="0.18"/><text x="542" y="246" fill="#10B981" text-anchor="middle">Surprise</text>
  </g>

  <!-- animated probability bars (baseline y=270) -->
  <g>
    <rect x="770" width="56" rx="10" fill="#F59E0B" y="70" height="200">
      <animate attributeName="height" values="200;90;160;200" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;180;110;70" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="838" width="56" rx="10" fill="#3B82F6" y="190" height="80">
      <animate attributeName="height" values="80;180;120;80" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="190;90;150;190" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="906" width="56" rx="10" fill="#EF4444" y="220" height="50">
      <animate attributeName="height" values="50;140;70;50" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="220;130;200;220" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="974" width="56" rx="10" fill="#EC4899" y="150" height="120">
      <animate attributeName="height" values="120;60;170;120" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="150;210;100;150" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="1042" width="56" rx="10" fill="#8B5CF6" y="230" height="40">
      <animate attributeName="height" values="40;110;60;40" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="230;160;210;230" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1110" width="56" rx="10" fill="#10B981" y="120" height="150">
      <animate attributeName="height" values="150;60;190;150" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="120;210;80;120" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <line x1="760" y1="272" x2="1180" y2="272" stroke="#2A2A44" stroke-width="2"/>
</svg>
